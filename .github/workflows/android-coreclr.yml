name: Android .NET 11 CoreCLR MAUI APK

on:
  workflow_dispatch:
  push:
    branches: [maui-android-net11-coreclr]
    paths:
      - "android/**"
      - ".github/workflows/android-coreclr.yml"

permissions:
  contents: read

concurrency:
  group: android-coreclr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build signed ARM64 APK with CoreCLR
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100
      - name: Install Android SDK command line tools
        uses: android-actions/setup-android@v3
      - name: Install MAUI Android workload for .NET 11
        working-directory: android
        run: |
          dotnet --info
          dotnet workload install maui-android
          dotnet workload list
      - name: Install required Android platform and tools
        working-directory: android
        run: |
          dotnet build StreetEcoTool.Mobile.csproj -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true -p:AndroidManifestMerger=manifestmerger.jar
      - name: Generate temporary test-only signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/experiment-signing.jks" -alias experiment -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=Street Eco Tool MAUI Experiment, O=Test, C=CN"
      - name: Build and sign Release CoreCLR APK
        working-directory: android
        run: |
          dotnet publish StreetEcoTool.Mobile.csproj \
            -c Release -f net11.0-android -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/experiment-signing.jks" \
            -p:AndroidSigningStorePass=android \
            -p:AndroidSigningKeyAlias=experiment \
            -p:AndroidSigningKeyPass=android \
            -p:PublishAot=false \
            -p:UseMonoRuntime=false
      - name: Verify CoreCLR files and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find android/bin/Release -name '*.apk' -type f -print
          apk="$(find android/bin/Release -name '*-Signed.apk' -type f | head -n 1)"
          if [ -z "$apk" ]; then
            apk="$(find android/bin/Release -name '*.apk' -type f | head -n 1)"
          fi
          test -n "$apk" && test -f "$apk"
          unzip -l "$apk" | tee dist/apk-contents.txt | grep -q 'lib/arm64-v8a/libcoreclr.so'
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libclrjit.so'
          if unzip -l "$apk" | grep -q 'libmonosgen-2.0.so'; then
            echo "::error::Unexpected Mono runtime in APK"
            exit 1
          fi
          cp "$apk" dist/StreetEcoTool-Mobile-net11-arm64.apk
          sha256sum dist/StreetEcoTool-Mobile-net11-arm64.apk > dist/StreetEcoTool-Mobile-net11-arm64.apk.sha256
          cp android/README.md dist/README-Android.md
          ls -lh dist/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-coreclr-arm64
          path: |
            dist/StreetEcoTool-Mobile-net11-arm64.apk
            dist/StreetEcoTool-Mobile-net11-arm64.apk.sha256
            dist/README-Android.md
          retention-days: 30
          if-no-files-found: error
