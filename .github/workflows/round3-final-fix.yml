name: Verify compact tags and point export boundary
on:
  push:
    branches: [hbtool]
    paths: ['.github/workflows/round3-final-fix.yml']
permissions:
  contents: write
  actions: write
jobs:
  finish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply bounded fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('web/app/assets/css/main.css');s=f.read_text()
          s += '\n/* Table cells keep full name tags on one line; the existing table viewport scrolls. */\n.table-wrap .name-tags { flex-wrap: nowrap; max-width: none; white-space: nowrap; }\n.table-wrap .name-tags [data-slot="base"] { flex-shrink: 0; white-space: nowrap; overflow-wrap: normal; height: 20px; padding-top: 0; padding-bottom: 0; }\n'
          f.write_text(s)
          f=Path('server/Startup.cs');s=f.read_text();old='            server.Limits.MaxRequestBodySize = 10L * 1024 * 1024;';assert old in s
          s=s.replace(old,old+'\n            // Up to 200 selected point IDs produce a bounded query slightly above 8 KiB.\n            server.Limits.MaxRequestLineSize = 16 * 1024;')
          f.write_text(s)
          f=Path('web/round3-browser-test.mjs');s=f.read_text();old="      const destination = path.join(evidence, 'round3-ledgers'); await mkdir(destination, { recursive: true })";assert old in s
          new="""      const boundaryQuery = new URLSearchParams({ from: bootstrap.today, to: bootstrap.today })
                for (let index = 0; index < 200; index++) boundaryQuery.append('pointId', point.id)
                const boundary = await fetch(directOrigin + '/api/exports/inspection-ledger?' + boundaryQuery)
                assert.equal(boundary.status, 200, 'The maximum point selection must fit the request-line limit')
                await boundary.arrayBuffer()
                boundaryQuery.append('pointId', point.id)
                const excessive = await fetch(directOrigin + '/api/exports/inspection-ledger?' + boundaryQuery)
                assert.equal(excessive.status, 400, 'Keep the server-side 200-point bound')
                await excessive.arrayBuffer()
          """
          s=s.replace(old,new+old)
          f.write_text(s)
          Path('.github/workflows/round3-final-fix.yml').unlink()
          PY
          node --check web/round3-browser-test.mjs
          git diff --check
      - name: Commit and run complete regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/hbtool | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/Startup.cs web .github/workflows/round3-final-fix.yml
          git commit -m 'fix: keep table name tags compact and accept bounded point-filter URLs'
          git push origin HEAD:hbtool
          gh api --method POST repos/${{ github.repository }}/actions/workflows/build.yml/dispatches -f ref=hbtool
