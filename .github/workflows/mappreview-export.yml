name: Mappreview rotated export regression

on:
  push:
    branches:
      - mappreview
      - 'fix/mappreview-*'
    paths:
      - 'mappreview/preview.html'
      - 'mappreview/rotation-export.test.mjs'
      - '.github/workflows/mappreview-export.yml'
  pull_request:
    branches: [mappreview]
    paths:
      - 'mappreview/preview.html'
      - 'mappreview/rotation-export.test.mjs'
      - '.github/workflows/mappreview-export.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check export geometry, composition and rendering lifecycle
        run: node --test mappreview/rotation-export.test.mjs
