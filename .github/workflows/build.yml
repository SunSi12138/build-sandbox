name: Build and verify hbtool

on:
  workflow_dispatch:
  push:
    branches: [hbtool]
    paths:
      - 'server/**'
      - 'web/**'
      - 'tests/**'
      - 'scripts/**'
      - '!scripts/optimization-stage.py'
      - 'global.json'
      - '.github/workflows/build.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - 'tests/**'
      - 'scripts/**'
      - '!scripts/optimization-stage.py'
      - 'global.json'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: hbtool-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Generate offline Nuxt SPA
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run generate
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-static
          path: web/.output/public/
          if-no-files-found: error
          retention-days: 14

  native:
    name: AOT ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Enable x64 MSVC tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Unit tests
        if: matrix.rid == 'linux-x64'
        run: dotnet test server/StreetEcoTool.Tests/StreetEcoTool.Tests.csproj -c Release -p:PublishAot=false --logger 'trx;LogFileName=unit-tests.trx' --results-directory test-results -warnaserror
      - name: Publish NativeAOT with zero warnings
        run: dotnet publish server/StreetEcoTool.csproj -c Release -r ${{ matrix.rid }} -o publish -p:PublishAot=true -p:SelfContained=true -warnaserror
      - name: Stage native executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $source = if ($IsWindows) { 'publish/StreetEcoTool.exe' } else { 'publish/StreetEcoTool' }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          Copy-Item $source "bin/StreetEcoTool-${{ matrix.rid }}$suffix"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.rid }}
          path: bin/
          if-no-files-found: error
          retention-days: 30
      - name: Verify static SQLite and run API integration tests
        shell: pwsh
        run: |
          $dynamic = @(Get-ChildItem publish -Recurse -File | Where-Object { $_.Name -match '^(lib)?e_sqlite3\.(dll|so|dylib)$' })
          if ($dynamic.Count -ne 0) { throw 'SQLite was not statically linked' }
          $executable = if ($IsWindows) { './publish/StreetEcoTool.exe' } else { './publish/StreetEcoTool' }
          python tests/api-smoke.py --executable $executable --report test-results/api-smoke-report.json
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT API integration tests failed' }
          python tests/word-smoke.py --executable $executable --report test-results/word-smoke-report.json
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT Word integration tests failed' }
      - name: Preserve test evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14


  native-arm64:
    name: AOT linux-arm64 (GLIBC 2.31)
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
    timeout-minutes: 35
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git clang zlib1g-dev libicu-dev python3 binutils
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish NativeAOT for Kylin V10
        run: dotnet publish server/StreetEcoTool.csproj -c Release -r linux-arm64 -o publish -p:PublishAot=true -p:SelfContained=true -warnaserror
      - name: Verify GLIBC compatibility and stage executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          cp publish/StreetEcoTool bin/StreetEcoTool-linux-arm64
          chmod +x bin/StreetEcoTool-linux-arm64
          glibc_versions="$(readelf --version-info bin/StreetEcoTool-linux-arm64 | grep -oE 'GLIBC_[0-9]+\.[0-9]+' || true)"
          if [ -z "$glibc_versions" ]; then
            echo "::error::No GLIBC version requirements detected; verify ELF linkage before accepting compatibility"
            exit 1
          fi
          max_glibc="$(printf '%s\n' "$glibc_versions" | sort -Vu | tail -1)"
          echo "Maximum required GLIBC: $max_glibc"
          if [ "$(printf '%s\n' GLIBC_2.31 "$max_glibc" | sort -V | tail -1)" != GLIBC_2.31 ]; then
            echo "::error::Linux ARM64 executable requires $max_glibc, exceeding Kylin V10 GLIBC_2.31"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-linux-arm64
          path: bin/
          if-no-files-found: error
          retention-days: 30
      - name: Run ARM64 API and Word smoke tests
        run: |
          python3 tests/api-smoke.py --executable ./publish/StreetEcoTool --report api-smoke-report.json
          python3 tests/word-smoke.py --executable ./publish/StreetEcoTool --report word-smoke-report.json


  package:
    name: Assemble one portable package
    needs: [web, native, native-arm64, browser, word-layout]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-static
          path: package-input/wwwroot
      - uses: actions/download-artifact@v8
        with:
          name: bin-win-x64
          path: package-input/bin
      - uses: actions/download-artifact@v8
        with:
          name: bin-linux-arm64
          path: package-input/bin
      - name: Package both architectures with shared frontend
        run: python scripts/package.py --win-x64 package-input/bin/StreetEcoTool-win-x64.exe --linux-arm64 package-input/bin/StreetEcoTool-linux-arm64 --web-static package-input/wwwroot --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: hbtool
          path: dist/
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Browser workflows and offline resources
    needs: [web, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: bin-linux-x64
          path: browser-package
      - uses: actions/download-artifact@v8
        with:
          name: web-static
          path: browser-package/wwwroot
      - run: chmod +x browser-package/StreetEcoTool-linux-x64
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Install Chinese fonts for screenshots
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Run the packaged app in a real browser
        run: node web/browser-test.mjs --executable browser-package/StreetEcoTool-linux-x64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: web/test-results/
          if-no-files-found: warn
          retention-days: 14

  word-layout:
    name: Render current document templates and boundary samples
    needs: [native]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install test-only local render tools
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libreoffice-writer poppler-utils fonts-noto-cjk fonts-dejavu python3-pil
      - uses: actions/download-artifact@v8
        with:
          name: bin-linux-x64
          path: layout-program
      - name: Export current synthetic scenarios through real APIs
        run: |
          chmod +x layout-program/StreetEcoTool-linux-x64
          python3 tests/word-layout-samples.py --executable layout-program/StreetEcoTool-linux-x64 --source-ref "$GITHUB_SHA" --expect-optimized --output test-results/word-layout/current
      - name: Convert and inspect the current templates
        run: python3 tests/render-word.py test-results/word-layout/current
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: word-layout-evidence
          path: test-results/word-layout/
          if-no-files-found: error
          retention-days: 14
