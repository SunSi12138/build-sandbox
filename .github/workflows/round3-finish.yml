name: Align field accessibility and regression selectors
on:
  push:
    branches: [hbtool]
    paths: ['.github/workflows/round3-finish.yml']
permissions:
  contents: write
  actions: write
jobs:
  finish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Align changed UI with accessibility and visual readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name, model in [('web/app/components/PointEditor.vue','state.coordinates'), ('web/app/pages/inspections/new.vue','draft.newPoint.coordinates'), ('web/app/components/RecordPointPicker.vue','newPoint.coordinates')]:
              f=Path(name);s=f.read_text();old='v-model="'+model+'"';assert old in s
              f.write_text(s.replace(old,old+' aria-label="经纬度"'))
          f=Path('web/browser-test.mjs');s=f.read_text()
          old="case 'point-detail': return count('.detail-grid') > 0 && count('[data-testid=\"photo-uploaded\"]') > 0"
          assert old in s
          s=s.replace(old,"case 'point-detail': return count('.detail-grid') > 0 && count('.photo-grid img') > 0")
          old="input('inspection-inspector')?.value && count('[data-testid=\"inspection-point-option\"]') > 0"
          assert old in s
          s=s.replace(old,"(input('inspection-inspector')?.value || input('inspection-inspector')?.closest('.names-editor')?.querySelector('.name-edit-tag')) && count('[data-testid=\"inspection-point-option\"]') > 0")
          f.write_text(s)
          f=Path('web/app/pages/campaigns/index.vue');s=f.read_text()
          old='<div v-if="from || to" class="chip-row">';assert old in s
          s=s.replace(old,'<div v-if="pointId" class="chip-row"><UButton :label="result?.items[0]?.pointName || \'所选点位\'" trailing-icon="i-lucide-x" color="neutral" variant="ghost" class="filter-chip" :aria-pressed="true" @click="pointId = \'\'" /></div>\n    '+old)
          f.write_text(s)
          Path('.github/workflows/round3-finish.yml').unlink()
          PY
          node --check web/browser-test.mjs
          git diff --check
      - name: Commit exact changes and run full regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/hbtool | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web .github/workflows/round3-finish.yml
          git commit -m 'fix: preserve coordinate accessible names and align read-only visual checks'
          git push origin HEAD:hbtool
          gh api --method POST repos/${{ github.repository }}/actions/workflows/build.yml/dispatches -f ref=hbtool
