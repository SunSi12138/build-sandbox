name: Correct photo conflict assertion
on:
  push:
    branches: [hbtool]
    paths: ['.github/workflows/round3-contract.yml']
permissions:
  contents: write
  actions: write
jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/round3-browser-test.mjs');s=p.read_text()
          old='      assert.equal(failure.status, 400)'
          assert s.count(old)==1
          s=s.replace(old,"      assert.equal(failure.status, 409)\n      assert.match((await failure.json()).message, /阶段不符/)")
          p.write_text(s)
          Path('.github/workflows/round3-contract.yml').unlink()
          PY
          node --check web/round3-browser-test.mjs
          git diff --check
      - name: Commit test contract and dispatch regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/hbtool | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/round3-browser-test.mjs .github/workflows/round3-contract.yml
          git commit -m 'test: assert existing photo-phase conflict without changing API semantics'
          git push origin HEAD:hbtool
          gh api --method POST repos/${{ github.repository }}/actions/workflows/build.yml/dispatches -f ref=hbtool
