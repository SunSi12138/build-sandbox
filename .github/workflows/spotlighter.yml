name: Spotlighter - Windows Native AOT

on:
  push:
    branches:
      - spotlighter
  pull_request:
    branches:
      - main
    paths:
      - 'Spotlighter/**'
      - '.github/workflows/spotlighter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-aot:
    name: Build native Windows executable
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish native AOT executable (win-x64)
        shell: pwsh
        run: |
          dotnet --info
          dotnet publish ./Spotlighter/Spotlighter.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -o ./artifacts/publish

      - name: Validate output
        shell: pwsh
        run: |
          $file = './artifacts/publish/Spotlighter.exe'
          if (-not (Test-Path $file)) { throw 'Expected native executable missing.' }
          $size = (Get-Item $file).Length
          if ($size -lt 100000) { throw "Unexpected native executable length: $size" }
          Write-Host "Native executable exists, bytes: $size"
          Get-ChildItem ./artifacts/publish | Select-Object Name, Length

      - name: Headless pixel-renderer smoke test (AOT exe)
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './artifacts/publish/Spotlighter.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native AOT render self-test returned $($process.ExitCode)" }
          Write-Host 'Native AOT print renderer self-test passed.'

      - name: CPU rendering benchmark (published native AOT)
        shell: pwsh
        run: |
          $report = './artifacts/benchmark.txt'
          $process = Start-Process -FilePath './artifacts/publish/Spotlighter.exe' -ArgumentList @('--benchmark', $report) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Benchmark failed with exit code $($process.ExitCode)" }
          Get-Content $report

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Spotlighter-win-x64-native-aot
          path: ./artifacts/publish/Spotlighter.exe
          if-no-files-found: error
          retention-days: 30
