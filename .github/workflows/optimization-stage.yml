name: Apply verified optimization stage (temporary)
on:
  push:
    branches: [hbtool]
    paths: ['scripts/optimization-stage.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hbtool-optimization-stage
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply narrowly scoped changes
        run: python3 scripts/optimization-stage.py
      - name: Unit regression
        run: dotnet test server/StreetEcoTool.Tests/StreetEcoTool.Tests.csproj -c Release -p:PublishAot=false --logger 'trx;LogFileName=unit-tests.trx' --results-directory test-results -warnaserror
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run generate
        working-directory: web
      - name: NativeAOT regression
        run: |
          dotnet publish server/StreetEcoTool.csproj -c Release -r linux-x64 -o publish -p:PublishAot=true -p:SelfContained=true -warnaserror
          python3 tests/api-smoke.py --executable publish/StreetEcoTool --report test-results/api-smoke-report.json
          python3 tests/word-smoke.py --executable publish/StreetEcoTool --report test-results/word-smoke-report.json
      - name: Commit verified changes and run target-platform regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          test "$(git ls-remote origin refs/heads/hbtool | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server web tests docs scripts README.md .github/workflows/build.yml
          git commit -F /tmp/hbtool-stage-message.txt
          git push origin HEAD:hbtool
          gh api --method POST repos/${{ github.repository }}/actions/workflows/build.yml/dispatches -f ref=hbtool
      - name: Preserve stage results and source
        if: always()
        run: |
          mkdir -p test-results
          git diff > test-results/stage.patch
          tar --exclude='*/node_modules' --exclude='*/bin' --exclude='*/obj' --exclude='*/.nuxt' --exclude='*/.output' --exclude='*/test-results' -czf test-results/stage-source.tar.gz server web tests scripts docs .github README.md global.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: optimization-stage-evidence
          path: test-results/
          retention-days: 14
